<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻辣工坊 客戶關係管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#FBF8F4; --surface:#FFFFFF; --surface-2:#F3EDE6; --surface-3:#EAE1D6; --border:#E4DACD;
    --text:#2B211A; --text-muted:#8A7A6B; --text-faint:#B3A594;
    --accent:#C1401D; --accent-strong:#9A2E13; --accent-soft:#F6DECE;
    --success:#3F7A4F; --success-soft:#DCEEDF; --warning:#B8791A; --warning-soft:#F5E4C2;
    --neutral-chip:#EDE6DC; --shadow:rgba(43,33,26,.10); --overlay:rgba(27,20,15,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .shell{ max-width:1240px; margin:0 auto; padding:28px 24px 64px; }
  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding-bottom:20px; margin-bottom:24px; border-bottom:1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{ width:44px; height:44px; border-radius:12px; flex:none; background:linear-gradient(155deg,var(--accent),var(--accent-strong)); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px var(--shadow); }
  .brand-mark svg{ width:24px; height:24px; }
  h1{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; margin:0; letter-spacing:.02em; }
  .brand-sub{ margin:2px 0 0; font-size:13px; color:var(--text-muted); }
  .top-right{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .today{ font-size:13px; color:var(--text-muted); }
  .today .mono{ color:var(--text); font-weight:500; }
  .logout-btn{ border:none; background:var(--surface-2); color:var(--text-muted); font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .logout-btn:hover{ background:var(--surface-3); color:var(--text); }
  .tabs{ display:flex; gap:4px; margin-bottom:22px; background:var(--surface-2); padding:4px; border-radius:11px; width:fit-content; }
  .tab-btn{ border:none; background:transparent; padding:9px 18px; border-radius:8px; font-family:inherit; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .tab-btn.active{ background:var(--surface); color:var(--accent-strong); box-shadow:0 1px 3px var(--shadow); }
  .view{ display:none; } .view.active{ display:block; }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
  .stat-label{ font-size:12.5px; color:var(--text-muted); font-weight:600; }
  .stat-value{ font-family:'IBM Plex Mono'; font-size:28px; font-weight:500; }
  .stat-delta{ font-size:12px; color:var(--text-faint); }
  .board-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .board-head h2{ font-size:16px; margin:0; font-weight:700; }
  .board-head p{ margin:2px 0 0; font-size:12.5px; color:var(--text-muted); }
  .board{ display:grid; grid-auto-flow:column; grid-auto-columns:236px; gap:14px; overflow-x:auto; padding-bottom:10px; }
  .col{ display:flex; flex-direction:column; min-width:0; }
  .col-head{ display:flex; align-items:center; justify-content:space-between; padding:0 4px 10px; border-bottom:2px solid var(--col-color,var(--border)); margin-bottom:10px; }
  .col-head-title{ font-size:13px; font-weight:700; }
  .col-count{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-muted); background:var(--surface-2); padding:1px 7px; border-radius:100px; }
  .col-cards{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; cursor:pointer; text-align:left; width:100%; display:flex; flex-direction:column; gap:7px; box-shadow:0 1px 2px var(--shadow); font-family:inherit; color:inherit; }
  .card:hover{ border-color:var(--accent); }
  .card-store{ font-size:13.5px; font-weight:700; }
  .card-contact{ font-size:12px; color:var(--text-muted); }
  .card-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .pill{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:var(--neutral-chip); color:var(--text-muted); white-space:nowrap; }
  .pill.warn{ background:var(--warning-soft); color:var(--warning); }
  .pill.ok{ background:var(--success-soft); color:var(--success); }
  .pill.accent{ background:var(--accent-soft); color:var(--accent-strong); }
  .card-due{ font-size:11px; color:var(--text-faint); }
  .scrim{ position:fixed; inset:0; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity .18s; z-index:20; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; height:100%; width:440px; max-width:92vw; background:var(--surface); border-left:1px solid var(--border); box-shadow:-12px 0 32px var(--shadow); transform:translateX(100%); transition:transform .22s ease; z-index:21; overflow-y:auto; }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:20px 22px 16px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:sticky; top:0; background:var(--surface); z-index:1; }
  .drawer-store{ font-size:17px; font-weight:700; margin:0 0 3px; }
  .drawer-contact{ font-size:13px; color:var(--text-muted); }
  .drawer-close{ border:none; background:var(--surface-2); width:30px; height:30px; border-radius:9px; color:var(--text-muted); cursor:pointer; font-size:16px; flex:none; }
  .drawer-body{ padding:18px 22px 28px; display:flex; flex-direction:column; gap:22px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .field-label{ font-size:11px; color:var(--text-faint); font-weight:600; margin-bottom:2px; }
  .field-value{ font-size:13.5px; }
  select.stage-select{ font-family:inherit; font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .section-title{ font-size:12.5px; font-weight:700; color:var(--text-muted); margin:0 0 10px; }
  .sample-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .sample-chip{ font-size:12px; background:var(--surface-2); border:1px solid var(--border); padding:4px 10px; border-radius:100px; }
  .followup-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--surface-2); border-radius:10px; font-size:12.5px; }
  .followup-row + .followup-row{ margin-top:6px; }
  .timeline{ display:flex; flex-direction:column; gap:0; }
  .t-item{ display:flex; gap:12px; position:relative; padding-bottom:16px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; margin-top:5px; box-shadow:0 0 0 3px var(--accent-soft); }
  .t-item:not(:last-child)::before{ content:''; position:absolute; left:4px; top:16px; bottom:0; width:1px; background:var(--border); }
  .t-content{ font-size:12.5px; line-height:1.55; }
  .t-date{ color:var(--text-faint); font-size:11px; margin-bottom:1px; }
  .note-box{ width:100%; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); padding:10px 12px; font-size:13px; font-family:inherit; color:var(--text); resize:vertical; min-height:56px; }
  .btn{ border:none; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.ghost{ background:var(--surface-2); color:var(--text); }
  .btn.ghost:hover{ background:var(--surface-3); }
  .ship-form{ display:flex; flex-direction:column; gap:8px; background:var(--surface-2); border-radius:10px; padding:12px; }
  .ship-form input, .ship-form textarea{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px; }
  .loading, .empty{ padding:40px; text-align:center; color:var(--text-muted); font-size:13px; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 18px; border-radius:100px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
  .toast.show{ opacity:1; }
  @media (max-width:860px){ .stats{ grid-template-columns:repeat(2,1fr); } .field-grid{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9c0-2.8 2.5-5.5 6-6.5.6 1 .3 2-.6 2.6C13 6 14.5 7 15 8.5c3 .3 5 2.7 5 5.8C20 18.5 16.5 21.5 12 21.5S4 18.5 4 14.3C4 12 4.8 10 6 9Z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>麻辣工坊 客戶關係管理</h1>
        <p class="brand-sub">LINE 官方帳號客戶開發自動化 · 業務追蹤看板</p>
      </div>
    </div>
    <div class="top-right">
      <div class="today">今天　<span class="mono" id="todayDate"></span></div>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="board-head">
    <div>
      <h2>客戶開發看板</h2>
      <p>依目前所在階段自動分類，點擊卡片查看完整資料與互動歷程</p>
    </div>
    <button class="btn ghost" id="refreshBtn">重新整理</button>
  </div>

  <div class="board" id="board"><div class="loading">載入中...</div></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
