<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台登入｜麻辣工坊</title>
<style>
  :root{ --bg:#FBF8F4; --surface:#fff; --border:#E4DACD; --text:#2B211A; --muted:#8A7A6B; --accent:#C1401D; --accent-strong:#9A2E13; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; width:340px; max-width:92vw; box-shadow:0 8px 24px rgba(43,33,26,.08); }
  h1{ font-size:18px; margin:0 0 4px; }
  p{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  input{ width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; margin-bottom:14px; font-family:inherit; }
  button{ width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button:hover{ background:var(--accent-strong); }
  #err{ color:var(--accent-strong); font-size:13px; margin-top:10px; min-height:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>麻辣工坊 後台管理</h1>
    <p>請輸入管理密碼登入客戶看板</p>
    <input type="password" id="password" placeholder="管理密碼" autofocus>
    <button id="loginBtn">登入</button>
    <div id="err"></div>
  </div>
<script>
  async function doLogin() {
    var pw = document.getElementById('password').value;
    var err = document.getElementById('err');
    err.textContent = '';
    try {
      var resp = await fetch('/api/admin/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      var data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || '登入失敗');
      window.location.href = '/admin/';
    } catch (e) {
      err.textContent = e.message;
    }
  }
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
